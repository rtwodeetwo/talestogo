# =============================================================================
# Tales Docker Compose Configuration
# =============================================================================
#
# Quick Start:
#   1. Copy .env.template to .env and fill in your values
#   2. Run: docker compose up -d
#   3. Create admin: docker compose exec app python scripts/admin/setup_initial_admin.py
#   4. Access at: http://localhost:8080
#
# Documentation: See IT_DEPLOYMENT_GUIDE.md
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Tales Application
  # ---------------------------------------------------------------------------
  app:
    # Check what a running instance actually is:
    #   curl http://localhost:8080/health
    # which reports the version, commit and build date baked in at build time.
    #
    # `latest` is deliberate here, and it means "the most recent release", not
    # "the tip of main": the publish workflow moves `latest` only on a version
    # tag. This file is served live from GitHub's main branch, so leaving it
    # unpinned is what keeps a fresh `docker compose up` current.
    #
    # To pin instead, name a released version, e.g. rtwodeetwo/tales:2.0.1.
    # The copy of this file inside a release's deployment-kit zip IS pinned,
    # because a snapshot should keep meaning what it meant on the day.
    image: rtwodeetwo/tales:latest
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      # Database (connects to the db service below)
      - DATABASE_URL=postgresql://tales:${DB_PASSWORD:-tales_password}@db:5432/tales

      # Security
      - APP_SECRET=${APP_SECRET:-${JWT_SECRET_KEY}}
      - JWT_SECRET_KEY=${APP_SECRET:-${JWT_SECRET_KEY}}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # Authentication Enable/Disable Flags
      - ENABLE_LOCAL_AUTH=${ENABLE_LOCAL_AUTH:-true}
      - ENABLE_MICROSOFT_AUTH=${ENABLE_MICROSOFT_AUTH:-true}
      - ENABLE_GOOGLE_AUTH=${ENABLE_GOOGLE_AUTH:-false}

      # OIDC/OAuth (for Microsoft Entra ID — no secret needed, uses PKCE)
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-${MICROSOFT_CLIENT_ID:-}}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration}
      - MICROSOFT_CLIENT_ID=${OIDC_CLIENT_ID:-${MICROSOFT_CLIENT_ID:-}}

      # OAuth flow configuration
      - AUTH_FLOW_TYPE=${AUTH_FLOW_TYPE:-popup}
      - AUTO_LOGIN_MICROSOFT=${AUTO_LOGIN_MICROSOFT:-false}

      # Google OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}

      # Branding (customize for your organization)
      - SITE_NAME=${SITE_NAME:-Tales}
      - SITE_LOGO_URL=${SITE_LOGO_URL:-}
      - SITE_PRIMARY_COLOR=${SITE_PRIMARY_COLOR:-#003e60}
      - SITE_SECONDARY_COLOR=${SITE_SECONDARY_COLOR:-#75c9c8}

      # LLM API Keys. At least one provider must be configured (see Admin → LLM
      # Providers in the UI). All are optional at the env-var level; the app
      # surfaces a clear error if nothing is configured.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      # Optional web-search providers (only needed if you want the State of the
      # LLMs report section AND aren't already using Gemini or Perplexity).
      - BING_SEARCH_V7_API_KEY=${BING_SEARCH_V7_API_KEY:-}
      - AZURE_AI_PROJECT_ENDPOINT=${AZURE_AI_PROJECT_ENDPOINT:-}
      - AZURE_AI_BING_CONNECTION_NAME=${AZURE_AI_BING_CONNECTION_NAME:-}
      # - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      # - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      # - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}

      # Email (optional - for sending user invitations)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-}

      # Application settings
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
      - PORT=8000

      # Investigations. Auto-triggers are ON by default; set to false to run
      # investigations only when someone asks for one from the UI. Worth turning
      # off around a data import or a change in collection method, when a large
      # movement is expected and already understood.
      # Thresholds are absolute percentage points. See docs/ENV_VARS_REFERENCE.md.
      - INVESTIGATIONS_AUTO_TRIGGER=${INVESTIGATIONS_AUTO_TRIGGER:-true}
      - INVESTIGATION_THRESHOLD_MENTION_RATE=${INVESTIGATION_THRESHOLD_MENTION_RATE:-10.0}
      - INVESTIGATION_THRESHOLD_POSITIVE_SENTIMENT_RATE=${INVESTIGATION_THRESHOLD_POSITIVE_SENTIMENT_RATE:-15.0}
      - INVESTIGATION_THRESHOLD_LEADERSHIP_VISIBILITY=${INVESTIGATION_THRESHOLD_LEADERSHIP_VISIBILITY:-15.0}
      - INVESTIGATION_THRESHOLD_SHARE_OF_VOICE=${INVESTIGATION_THRESHOLD_SHARE_OF_VOICE:-10.0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=tales
      - POSTGRES_PASSWORD=${DB_PASSWORD:-tales_password}
      - POSTGRES_DB=tales
    volumes:
      - tales_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tales -d tales"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network
    # Uncomment to expose database port for external access:
    # ports:
    #   - "5432:5432"

# =============================================================================
# Networks
# =============================================================================
networks:
  app_network:
    driver: bridge

# =============================================================================
# Persistent Data Volumes
# =============================================================================
volumes:
  tales_postgres_data:
    # Database data persists here across container restarts
    # To backup: docker compose exec db pg_dump -U tales tales > backup.sql
    # To restore: docker compose exec -T db psql -U tales tales < backup.sql
