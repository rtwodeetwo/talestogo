[project]
name = "talestogo"
version = "2.0.3"

# Optional dependencies — install with: pip install .[<extra>]
# These are NOT installed by `pip install -r requirements.txt`. They light up
# additional providers in Admin → LLM Providers; the rest of the app runs
# fine without them.
[project.optional-dependencies]
# Azure AI Foundry Agents — adds the azure_foundry_agents api_type so an
# Azure-only deployment can populate the State of the LLMs report section
# without bringing in Gemini or Perplexity. Uses Foundry Prompt Agents
# invoked via the OpenAI Responses API with Grounding-with-Bing-Search.
#
# Install: pip install .[azure-foundry]
azure-foundry = [
    "azure-ai-projects>=2.2.0",
    "azure-identity>=1.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

# Pytest configuration.
#
# Restrict collection to the tests/ suite. Without this, a bare `pytest`
# invocation also tries to import standalone scripts under scripts/testing/
# (e.g. test_api_reports.py), which call exit(1) at import time and crash
# collection. The real suite lives entirely in tests/.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reconciliation: cross-surface metric reconciliation. Known disagreements are marked xfail with the file:line responsible; that list is the migration checklist. Run with --runxfail to see the full matrix.",
]

# Bandit (Python SAST) configuration.
#
# NOTE: bandit only reads this file when invoked with `-c pyproject.toml`.
# Use scripts/run_sast.sh, which passes it (along with the equivalent flags
# for the other scanners) so local and CI runs agree.
#
# Excluded paths are all outside the deployed request-handling surface:
# - scripts/admin/sync_prod_to_localhost.py builds dynamic SQL by inspecting
#   the schema and is only run manually by the maintainer to copy prod data
#   to a localhost dev DB. Its B608 SQL-injection findings are false positives
#   (table/column identifiers come from SQLAlchemy schema inspection, not user
#   input) and would otherwise drown out legitimate signal from app/.
# - scripts/migrations/ contains one-shot historical migration scripts that
#   aren't re-run.
# - scripts/data/ and scripts/generate_fake_trend_data.py generate synthetic
#   demo data. Their B311 findings flag `random` as a non-cryptographic RNG,
#   which is exactly what fake sample data should use. Real secrets in this
#   codebase come from `secrets` (see app/routers/users.py, app/main.py).
# - app/test_user_isolation.py is a test; B101 flags its `assert`s, which are
#   the point of a test rather than a runtime control.
[tool.bandit]
exclude_dirs = [
    "scripts/admin",
    "scripts/migrations",
    "scripts/data",
    "scripts/generate_fake_trend_data.py",
    "app/test_user_isolation.py",
]

# B404 flags `import subprocess` and B603 flags any subprocess call that does
# NOT use a shell. The no-shell form is the safe one, so B603 fires on correct
# code; every call site here passes an argument list whose values are
# stringified integers and ISO dates, never a shell string.
#
# The checks that catch the genuinely dangerous variants stay ON: B602
# (subprocess with shell=True), B605 (os.system-style shell call) and B607
# (partial executable path). run_sast.sh additionally greps for shell=True so
# a regression can't hide behind these two skips.
skips = ["B404", "B603"]