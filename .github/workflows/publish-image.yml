# =============================================================================
# Publish the Tales container image to Docker Hub
# =============================================================================
# Why this exists: the previously published image was pushed by hand and went
# five months without an update, so the deployment kit pointed at a build that
# predated most of the codebase. This makes publishing automatic, so the tag a
# lab pulls always corresponds to a commit that exists.
#
# Triggers:
#   - push to main        -> :main and :edge
#   - version tag v2.0.0  -> :2.0.0, :2.0, :latest
#   - manual dispatch     -> for the first run, before any tag exists
#
# `latest` only ever moves on a version tag. A lab pinning :latest gets the
# most recent release, not the tip of main.
#
# Required repository secret:
#   DOCKERHUB_TOKEN - a Docker Hub access token with Read/Write scope
#                     (Docker Hub > Account Settings > Personal access tokens)
# The account name is not a secret and is set literally in the login step.
# =============================================================================

name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  # This is the name already published to deployers in writing, and the name the
  # deployment kit's docker-compose.yml pulls. Do not rename it without also
  # updating the kit and telling anyone already running it.
  IMAGE_NAME: rtwodeetwo/tales

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # Not a secret: it is the namespace in IMAGE_NAME above and is public
          # on Docker Hub. Keeping it literal removes a second secret to set and
          # a silent-empty-value failure mode. Only the token is sensitive.
          username: rtwodeetwo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Tales
            org.opencontainers.image.description=AI reputation monitoring platform

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only, by decision rather than by accident.
          #
          # The February image was multi-arch, but the only arm64 activity ever
          # recorded against it was a crawler enumerating manifests (three
          # non-amd64 manifests fetched within 2.7ms of each other), not a
          # deployment. No known consumer runs ARM.
          #
          # If an ARM deployer does appear, they get an explicit manifest error
          # and can build from source, which is supported and documented. To
          # restore the platform, do NOT simply add linux/arm64 here: that
          # builds it under QEMU, where `npm ci` alone ran 46 minutes without
          # finishing. Build it on a native ubuntu-24.04-arm runner (verified
          # available and free to this repo) and merge the manifests.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          # VITE_API_URL is deliberately NOT passed. Left unset, the frontend
          # resolves the API at same-origin (frontend/src/services/api.ts),
          # which is correct for any host. Baking in a value here would pin
          # every deployment of this image to one URL.

      - name: Report what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "revision: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
