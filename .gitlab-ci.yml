# =============================================================================
# Tales GitLab CI/CD Pipeline (PPPL-Compliant)
# =============================================================================
# Automatically builds and pushes Docker images to the GitLab Container Registry.
#
# Uses Kaniko for building images (no privileged mode required).
#
# Tagging Strategy:
#   - Main branch: tagged as :latest
#   - Version tags (v1.0.0): tagged with version number
#   - Feature branches: tagged with branch name
# =============================================================================

stages:
  - build
  - deploy

build_container:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    # Determine image tag based on branch/tag
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        tag="latest"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        tag="$CI_COMMIT_TAG"
      else
        tag="$CI_COMMIT_REF_SLUG"
      fi
    # Provenance, consumed by the ARGs in the Dockerfile and reported at
    # GET /health. Without these the endpoint answers "unknown" for all three
    # and a running deployment cannot be matched back to a commit, which is
    # what made "is the new build live yet?" guesswork during the 2.0 release.
    # APP_VERSION is the tag when building a tag, otherwise the branch name;
    # GIT_SHA is the precise identifier either way.
    - |
      app_version="${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"
      build_date="${CI_JOB_STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
      echo "Provenance: version=$app_version revision=$CI_COMMIT_SHA built=$build_date"
    - echo "Building and pushing $CI_REGISTRY_IMAGE:$tag"
    # Create Docker config for registry authentication
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    # Build and push with Kaniko
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$tag"
      --build-arg "VITE_API_URL=${VITE_API_URL:-}"
      --build-arg "VITE_MICROSOFT_CLIENT_ID=${VITE_MICROSOFT_CLIENT_ID:-}"
      --build-arg "APP_VERSION=$app_version"
      --build-arg "GIT_SHA=$CI_COMMIT_SHA"
      --build-arg "BUILD_DATE=$build_date"
      --cache=true
      --cache-repo "$CI_REGISTRY_IMAGE/cache"
  rules:
    # Run on any branch or tag
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

deploy_to_portainer:
  stage: deploy
  image: alpine:3.19
  script:
    - apk add --no-cache curl
    # This job used to print "Deploy triggered successfully" whether the webhook
    # fired, returned 404, or the variable was empty: `curl -s ... || echo`
    # swallowed the failure, and `-s` on its own does not treat an HTTP error as
    # one. A deploy step that cannot fail reports "tried", not "succeeded".
    - |
      if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
        echo "PORTAINER_WEBHOOK_URL is not set, so nothing can be notified."
        echo "Set it under Settings > CI/CD > Variables (masked)."
        exit 1
      fi
    - echo "Triggering Portainer service update..."
    # --fail-with-body turns an HTTP error into a non-zero exit while still
    # printing the response, which is what tells you why it was rejected.
    - curl --fail-with-body --silent --show-error -X POST "$PORTAINER_WEBHOOK_URL"
    # The swarm restart is rolling, so the old container keeps answering 200
    # while the new one comes up. Acceptance is not yet arrival.
    #
    # Keep these in a block scalar. An unquoted `echo "a: b"` is a YAML mapping,
    # not a string, and GitLab rejects the whole config with "script config
    # should be a string or a nested array of strings", which fails the pipeline
    # before any job is created.
    - |
      echo "Portainer accepted the webhook for $CI_COMMIT_SHORT_SHA."
      echo "Not live yet: GET /health reports revision=$CI_COMMIT_SHA once it is."
  rules:
    # Only deploy from main branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build_container
